<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة وتشغيل منتجع الواحة السياحي - الحديدة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0f2c59;
      --primary-light: #1e4986;
      --secondary: #c5a059;
      --secondary-light: #dfba73;
      --dark: #07172e;
      --light: #f8fafc;
      --white: #ffffff;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --cyan: #06b6d4;
      --purple: #8b5cf6;
      --teal: #0d9488;
      --amber: #d97706;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-500: #64748b;
      --shadow-sm: 0 2px 5px rgba(0,0,0,0.05);
      --shadow-md: 0 5px 15px rgba(0,0,0,0.08);
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: #f1f5f9; color: #334155; min-height: 100vh; display: flex; flex-direction: column; }
    
    .auth-bar {
      background: var(--dark);
      color: #cbd5e1;
      padding: 8px 1.5rem;
      font-size: 0.82rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .auth-user-info { display: flex; align-items: center; gap: 8px; font-weight: 700; }
    .auth-user-badge { background: var(--secondary); color: var(--primary); padding: 3px 12px; border-radius: 12px; font-size: 0.75rem; }
    .header-datetime {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(197, 160, 89, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #f8fafc;
      font-weight: 700;
    }
    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.78rem;
      transition: all 0.2s;
    }
    .btn-logout:hover { background: var(--danger); color: var(--white); }

    header {
      background: linear-gradient(135deg, var(--primary) 0%, #081a36 100%);
      color: var(--white);
      padding: 1rem 1.5rem;
      box-shadow: var(--shadow-md);
      border-bottom: 3px solid var(--secondary);
    }
    .header-container { max-width: 1440px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand i { font-size: 2.2rem; color: var(--secondary); }
    .brand-title h1 { font-size: 1.25rem; font-weight: 800; }
    .brand-title p { font-size: 0.8rem; color: var(--secondary-light); }
    
    .role-switcher {
      display: flex;
      background: rgba(255, 255, 255, 0.12);
      padding: 4px;
      border-radius: 30px;
      gap: 4px;
      flex-wrap: wrap;
    }
    .role-btn {
      background: transparent;
      border: none;
      color: #cbd5e1;
      padding: 6px 11px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.78rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .role-btn.active, .role-btn:hover { background: var(--secondary); color: var(--primary); }
    
    main { flex: 1; max-width: 1440px; width: 100%; margin: 1.5rem auto; padding: 0 1rem; }
    .view-section { display: none; animation: fadeIn 0.25s ease; }
    .view-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    
    .content-box { background: var(--white); border-radius: var(--radius); padding: 1.5rem; box-shadow: var(--shadow-sm); margin-bottom: 1.5rem; border: 1px solid var(--gray-200); }
    .content-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; padding-bottom: 0.75rem; border-bottom: 2px solid var(--gray-100); flex-wrap: wrap; gap: 10px; }
    .content-header h3 { font-size: 1.15rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .kpi-card { background: var(--white); border-radius: var(--radius); padding: 1.15rem; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-sm); border-right: 4px solid var(--primary); }
    .kpi-info p { font-size: 0.8rem; color: var(--gray-500); font-weight: 700; }
    .kpi-info h2 { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-top: 4px; }
    .kpi-icon { width: 42px; height: 42px; border-radius: 10px; background: var(--gray-100); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--primary); }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 0.82rem; font-weight: 700; color: var(--dark); }
    .form-control { padding: 9px 12px; border-radius: 8px; border: 1px solid var(--gray-200); font-size: 0.88rem; background: #fafbfc; }
    .form-control:focus { outline: none; border-color: var(--primary); background: #fff; }

    .btn { padding: 9px 18px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: all 0.2s; }
    .btn-primary { background: var(--primary); color: var(--white); }
    .btn-secondary { background: var(--secondary); color: var(--primary); }
    .btn-success { background: var(--success); color: var(--white); }
    .btn-danger { background: var(--danger); color: var(--white); }
    .btn-cyan { background: var(--cyan); color: var(--white); }
    .btn-purple { background: var(--purple); color: var(--white); }
    .btn-teal { background: var(--teal); color: var(--white); }
    .btn-amber { background: var(--amber); color: var(--white); }
    .btn-sm { padding: 5px 10px; font-size: 0.78rem; border-radius: 6px; }

    .table-container { overflow-x: auto; max-height: 520px; }
    table { width: 100%; border-collapse: collapse; text-align: right; }
    th { background: var(--gray-100); color: var(--dark); padding: 11px 13px; font-size: 0.82rem; font-weight: 700; border-bottom: 2px solid var(--gray-200); position: sticky; top: 0; z-index: 5; }
    td { padding: 11px 13px; font-size: 0.82rem; border-bottom: 1px solid var(--gray-200); }
    tr:hover { background: #f8fafc; }

    .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
    .badge-primary { background: #e0e7ff; color: #3730a3; }
    .badge-success { background: #dcfce7; color: #166534; }
    .badge-warning { background: #fef3c7; color: #92400e; }
    .badge-danger { background: #fee2e2; color: #991b1b; }
